[project]
name = "fragforce-read"
version = "1.0.3"
description = "Audio playback service for the VTO Book Reading project"
requires-python = ">=3.13"
dependencies = [
    "django>=6.1,<6.2",
    "psycopg[binary]>=3.3.4",
    "gunicorn>=23.0",
    "django-environ>=0.14.0",
    "whitenoise>=6.12.0",
    "qrcode[pil]>=8.2",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.15.4",
    "django-debug-toolbar>=7.0.0",
    "pytest>=9.1.1",
    "pytest-django>=4.13.0",
    "ruff>=0.16.2",
]

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["books/tests", "registration/tests", "tests"]
